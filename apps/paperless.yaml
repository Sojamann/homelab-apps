# paperless-ngx gets its own Kustomization so its health, retries and prune
# boundary are its own -- a broken app here fails alone instead of stalling the
# tier's other workloads.
#
# `substituteFrom` does not inherit from the tier that applies this. Without it
# `${app_domain}` renders empty and envsubst says nothing about it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/paperless
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
