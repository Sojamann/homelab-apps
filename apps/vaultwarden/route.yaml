apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - passwords.${app_domain}
  rules:
    # Envoy's 15s default would cut off large attachment uploads.
    - timeouts:
        request: 0s
      backendRefs:
        - name: vaultwarden
          port: 8080
