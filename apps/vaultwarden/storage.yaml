# On `fast`: a block device, so SQLite runs in its default WAL mode. Backed up
# by backup.yaml -- see docs/volsync.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast
  resources:
    requests:
      storage: 1Gi
