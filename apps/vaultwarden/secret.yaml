# The /admin token's argon2 hash, written in platform_secrets.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vaultwarden
  data:
    - secretKey: admin-token
      remoteRef:
        key: vaultwarden/app
        property: admin-token
