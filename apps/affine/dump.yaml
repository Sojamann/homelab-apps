# Nightly logical dump of AFFiNE's postgres, ahead of the VolSync run -- as
# for DHS (apps/dhs/dump.yaml). Written aside and renamed, so the clone never
# catches a half-written file. Same major as the Cluster (17): a newer dump
# does not restore with the server's own pg_restore. As the app role, the
# owner of everything in the db.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump
  namespace: affine
spec:
  schedule: "45 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70 # postgres, in the alpine image
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: docker.io/library/postgres:17.11-alpine
              command:
                - sh
                - -euc
                - |
                  pg_dump -Fc -f /dump/postgres.dump.tmp
                  sync
                  mv /dump/postgres.dump.tmp /dump/postgres.dump
                  ls -l /dump/postgres.dump
              env:
                - name: PGHOST
                  value: affine-pg-rw
                - name: PGDATABASE
                  value: affine
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: affine-pg-app, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: affine-pg-app, key: password }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: dump
                  mountPath: /dump
          volumes:
            - name: dump
              persistentVolumeClaim:
                claimName: postgres-dump
