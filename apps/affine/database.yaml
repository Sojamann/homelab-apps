# Docs, users, workspaces. One instance, no CNPG backups: dump.yaml is the
# backup. The `standard` image ships pgvector; AFFiNE's migrations create
# `vector` and `pgcrypto` only if they can, and the app role cannot -- so
# initdb does, as superuser. `affine-pg-app` (user, password, host, ...) is
# CNPG's, generated at bootstrap.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: affine-pg
  namespace: affine
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  bootstrap:
    initdb:
      database: affine
      owner: affine
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pgcrypto
  storage:
    storageClass: fast
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
