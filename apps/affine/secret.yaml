# AFFiNE's config dir, rendered whole: config.json (git's settings plus the
# Pocket ID client) and private.key, the key it signs tokens and encrypts
# data with. Both from kv/affine/app, written in platform_secrets.tf -- the
# key is generated there, as AFFiNE would otherwise make a new one per start.
# Read at startup only: after a change, restart the Deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-config
  namespace: affine
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: affine-config
    template:
      data:
        private.key: "{{ .privateKey }}"
        # allowPrivateNetwork: Pocket ID resolves to the gateway's LAN address.
        # allowSignup off: accounts come from SSO, or the admin's first setup.
        config.json: |
          {
            "server": {
              "name": "Lab",
              "externalUrl": "https://affine.${app_domain}"
            },
            "auth": {
              "allowSignup": false,
              "allowSignupForOauth": true
            },
            "flags": { "allowGuestDemoWorkspace": false },
            "copilot": { "enabled": false },
            "oauth": {
              "providers.oidc": {
                "issuer": "https://login.${app_domain}",
                "clientId": "{{ .clientId }}",
                "clientSecret": "{{ .clientSecret }}",
                "allowPrivateNetwork": true,
                "args": {}
              }
            }
          }
  data:
    - secretKey: privateKey
      remoteRef:
        key: affine/app
        property: private-key
    - secretKey: clientId
      remoteRef:
        key: affine/app
        property: oidc-client-id
    - secretKey: clientSecret
      remoteRef:
        key: affine/app
        property: oidc-client-secret
