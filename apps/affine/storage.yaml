# Blobs (attachments, images, avatars): a static PV on a fixed directory of
# the `k8s-csi` export, as for memos' attachments -- `Retain`, so deleting
# the PVC, the namespace or this file leaves them; a rebuild re-binds by name.
# Created by hand on the NAS (owned by uid 1000). NAS snapshots on
# `slow/k8s-csi` are its backup.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: affine-storage
spec:
  capacity:
    # A label -- NFS directory, not enforced.
    storage: 10Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: affine-storage
    volumeAttributes:
      # The NAS's k8s address, as in the `bulk` StorageClass.
      server: 10.212.4.150
      share: /mnt/slow/k8s-csi/affine
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-storage
  namespace: affine
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: affine-storage
  resources:
    requests:
      storage: 10Gi
---
# The latest dump only; history is restic's, by backup.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-dump
  namespace: affine
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast
  resources:
    requests:
      storage: 5Gi
