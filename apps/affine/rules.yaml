# `origin: lab` -- see infrastructure/configs/proxmox/rules.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: affine
  namespace: monitoring
spec:
  groups:
    - name: affine
      rules:
        # As DhsDumpStale: VolSync keeps backing up a stale file without complaint.
        - alert: AffineDumpStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="affine", cronjob="postgres-dump"} > 26 * 3600
          for: 15m
          labels:
            severity: warning
            origin: lab
          annotations:
            summary: No successful AFFiNE postgres dump in over 26h
