apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine
  namespace: affine
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - affine.${app_domain}
  rules:
    - backendRefs:
        - name: affine
          port: 3010
