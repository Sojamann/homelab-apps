# The admin GUI. Behind its own login; LAN and tailnet only, like every
# hostname on the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing
  namespace: syncthing
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - sync.${app_domain}
  rules:
    - backendRefs:
        - name: syncthing
          port: 8384
---
# The sync protocol, on the Gateway's `syncthing` listener (:22000). No
# hostname -- syncthing's TLS sends no SNI -- so any name on the Gateway's
# address reaches this; devices use `tcp://sync.${app_domain}:22000`.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: syncthing
  namespace: syncthing
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: syncthing
  rules:
    - backendRefs:
        - name: syncthing
          port: 22000
---
# QUIC, on the Gateway's `syncthing-quic` listener (:22000/udp). Devices that
# list `quic://sync.${app_domain}:22000` too use it when TCP is blocked.
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: syncthing-quic
  namespace: syncthing
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: syncthing-quic
  rules:
    - backendRefs:
        - name: syncthing
          port: 22000
