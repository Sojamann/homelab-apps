# GUI password and API key, generated in platform_secrets.tf. The API key is
# also what Prometheus presents for /metrics.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing
  namespace: syncthing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: syncthing
  data:
    - secretKey: gui-password
      remoteRef:
        key: syncthing/app
        property: gui-password
    - secretKey: api-key
      remoteRef:
        key: syncthing/app
        property: api-key
