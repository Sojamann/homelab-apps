# Break-glass admin password (generated) and the Pocket ID client (vault),
# written in platform_secrets.tf. Read by config.yaml through env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos
  namespace: memos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: memos
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: memos/app
        property: admin-password
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: memos/app
        property: oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: memos/app
        property: oidc-client-secret
