# Attachments: a static PV on a fixed directory of the `k8s-csi` export, as
# for syncthing's files -- `Retain`, so deleting the PVC, the namespace or this
# file leaves them; a rebuild re-binds by name. Created by hand on the NAS
# (owned by uid 1000). NAS snapshots on `slow/k8s-csi` are its backup.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: memos-assets
spec:
  capacity:
    # A label -- NFS directory, not enforced.
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: memos-assets
    volumeAttributes:
      # The NAS's k8s address, as in the `bulk` StorageClass.
      server: 10.212.4.150
      share: /mnt/slow/k8s-csi/memos
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-assets
  namespace: memos
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: memos-assets
  resources:
    requests:
      storage: 5Gi
---
# The SQLite db: memos, users, settings, and each attachment's path. On
# `fast`, as SQLite wants a block device; backed up by backup.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-data
  namespace: memos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast
  resources:
    requests:
      storage: 1Gi
