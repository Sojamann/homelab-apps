apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # First install and each `occ upgrade` run before the pod is ready.
  timeout: 15m
  path: ./apps/nextcloud
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
