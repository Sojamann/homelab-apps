# Same shape as paperless.yaml. No healthChecks on the Database: immich-server
# crash-loops until the extensions exist, which is also what it does after any
# DB outage.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/immich
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
