apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Db migrations run before the server turns Ready.
  timeout: 15m
  path: ./apps/immich
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
