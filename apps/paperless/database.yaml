# Provision a postgres cluster on fast storage.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: paperless
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  storage:
    size: 10Gi
    storageClass: fast

  bootstrap:
    initdb:
      database: paperless
      owner: paperless

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
