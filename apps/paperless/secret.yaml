# Two generated values from OpenBao. The database credential is not among them:
# CNPG writes its own into `paperless-db-app`, in this namespace.
#
# `paperless/paperless` is relative to the `kv` mount the store names -- the
# tree is kv/<namespace>/<app>/<key>, and both halves are this app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless
  data:
    - secretKey: secret-key
      remoteRef:
        key: paperless/paperless
        property: secret-key
    - secretKey: admin-password
      remoteRef:
        key: paperless/paperless
        property: admin-password
