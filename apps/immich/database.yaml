# One instance, no CNPG backup: the NAS's zvol snapshots are (crash-consistent,
# postgres replays its WAL). VectorChord for smart search and faces; Postgres
# must stay within what Immich supports (>= 14, < 20).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1
  postgresql:
    shared_preload_libraries: [vchord.so]
  # Superuser, as upstream expects: Immich creates and updates its extensions
  # (vchord, earthdistance) itself on start, including after a VectorChord bump.
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        superuser: true
  bootstrap:
    initdb:
      database: immich
      owner: immich
      dataChecksums: true
  storage:
    storageClass: fast
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
