apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - photos.${app_domain}
  rules:
    # Unset, Cilium leaves Envoy's 15s route timeout, which counts until the
    # response is fully sent -- a video download or playback longer than that
    # is cut. 0s disables it.
    - timeouts:
        request: 0s
      backendRefs:
        - name: immich-server
          port: 2283
