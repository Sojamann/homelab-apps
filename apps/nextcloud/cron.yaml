# Nextcloud's background jobs (cleanup, versions/trash expiry, previews), the
# `cron.php` way it recommends. Same image, volumes and db as the server; the
# html volume is RWO, fine on the one node.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cron
              image: docker.io/library/nextcloud:35.0.1-apache
              command: [php, -f, /var/www/html/cron.php]
              env:
                - name: POSTGRES_HOST
                  value: nextcloud-db-rw
                - name: POSTGRES_DB
                  value: nextcloud
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef: { name: nextcloud-db-app, key: username }
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: nextcloud-db-app, key: password }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
              volumeMounts:
                - name: html
                  mountPath: /var/www/html
                - name: data
                  mountPath: /var/www/html/data
                - name: config
                  mountPath: /var/www/html/config/lab.config.php
                  subPath: lab.config.php
          volumes:
            - name: html
              persistentVolumeClaim:
                claimName: nextcloud-html
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data
            - name: config
              configMap:
                name: nextcloud-config
