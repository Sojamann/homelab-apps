# Break-glass admin and the Pocket ID client (vault), written in
# platform_secrets.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud
  data:
    - secretKey: NEXTCLOUD_ADMIN_PASSWORD
      remoteRef:
        key: nextcloud/app
        property: admin-password
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: nextcloud/app
        property: oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: nextcloud/app
        property: oidc-client-secret
