# The files: a static PV on a fixed directory of the `k8s-csi` export, as for
# memos' attachments -- `Retain`, a rebuild re-binds by name. Created by hand on
# the NAS, owned by uid 33 (www-data), mode 0770 (Nextcloud refuses a
# world-readable data dir). NAS snapshots on `slow/k8s-csi` are its backup.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
spec:
  capacity:
    # A label -- NFS directory, not enforced.
    storage: 500Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nextcloud-data
    volumeAttributes:
      server: 10.212.4.150
      share: /mnt/slow/k8s-csi/nextcloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: nextcloud-data
  resources:
    requests:
      storage: 500Gi
---
# /var/www/html: the code (copied from the image on install/upgrade),
# config.php with instanceid/secret/passwordsalt, and installed apps. Backed up
# by backup.yaml -- losing config.php's secret loses every encrypted app value.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: nextcloud
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast
  resources:
    requests:
      storage: 5Gi
---
# The latest dump only; history is restic's, by backup.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-dump
  namespace: nextcloud
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast
  resources:
    requests:
      storage: 5Gi
