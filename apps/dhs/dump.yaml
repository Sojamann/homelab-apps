# Nightly logical dump of DHS's postgres, ahead of the VolSync run at 01:00.
# Written aside and renamed, so the clone never catches a half-written file.
# Same major as the server (17): pg_dump may be newer, but a newer dump does
# not restore with the server's own pg_restore.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump
  namespace: dhs
spec:
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70 # postgres, in the alpine image
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: docker.io/library/postgres:17.11-alpine
              command:
                - sh
                - -euc
                - |
                  pg_dump -Fc -f /dump/postgres.dump.tmp
                  sync
                  mv /dump/postgres.dump.tmp /dump/postgres.dump
              env:
                - name: PGHOST
                  value: dhs
                - name: PGDATABASE
                  value: postgres
              envFrom:
                - secretRef:
                    name: postgres-backup
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: dump
                  mountPath: /dump
          volumes:
            - name: dump
              persistentVolumeClaim:
                claimName: postgres-dump
