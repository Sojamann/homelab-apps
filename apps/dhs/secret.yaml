# The read-only backup role, written in platform_secrets.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup
  namespace: dhs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postgres-backup
  data:
    - secretKey: PGUSER
      remoteRef:
        key: dhs/backup
        property: user
    - secretKey: PGPASSWORD
      remoteRef:
        key: dhs/backup
        property: password
