# node_exporter on the box, behind `tailscale serve` -- through egress.yaml.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: dhs
  namespace: monitoring
spec:
  jobName: dhs
  # Not the proxy Service's name, which is all the target address says.
  relabelings:
    - targetLabel: instance
      replacement: dhs
  staticConfigs:
    - targets:
        - dhs.dhs.svc.cluster.local:9100
      labels:
        node: dhs
