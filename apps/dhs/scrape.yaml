# node_exporter on the box, behind `tailscale serve` -- through egress.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: dhs
  namespace: monitoring
spec:
  # No jobName on a VMScrapeConfig, see infrastructure/configs/nas/scrape.yaml.
  # `instance`: not the proxy Service's name, which is all the target address
  # says.
  relabelConfigs:
    - targetLabel: job
      replacement: dhs
    - targetLabel: instance
      replacement: dhs
  staticConfigs:
    - targets:
        - dhs.dhs.svc.cluster.local:9100
      labels:
        node: dhs
