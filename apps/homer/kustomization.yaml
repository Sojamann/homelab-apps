apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - server.yaml
  - route.yaml
# The name's hash suffix rolls the pod on every config change, which a subPath
# mount would not pick up on its own.
configMapGenerator:
  - name: homer-config
    namespace: homer
    files:
      - config.yml
