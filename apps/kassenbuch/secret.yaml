# The login's argon2 hash and the Verein's name, written in platform_secrets.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kassenbuch
  namespace: kassenbuch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kassenbuch
  data:
    - secretKey: password-hash
      remoteRef:
        key: kassenbuch/app
        property: password-hash
    - secretKey: association-name
      remoteRef:
        key: kassenbuch/app
        property: association-name
