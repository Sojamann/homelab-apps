apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kassenbuch
  namespace: kassenbuch
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - kassenbuch.${app_domain}
  rules:
    # Envoy's 15s default would cut off large Beleg uploads and zip imports.
    - timeouts:
        request: 0s
      backendRefs:
        - name: kassenbuch
          port: 3000
