# The Pocket ID client (vault), written in platform_secrets.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
  namespace: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mealie
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: mealie/app
        property: oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: mealie/app
        property: oidc-client-secret
