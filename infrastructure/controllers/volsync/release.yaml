# Backs up `fast` PVCs with restic to Garage -- see docs/volsync.md.
#
# It installs CRDs and watches every namespace. A `ReplicationSource` lives
# beside the app it backs up; the mover Job runs in that app's namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 1h
  chart:
    spec:
      chart: volsync
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: backube
  values:
    manageCRDs: true
    # The chart's ServiceMonitor sends no token, so with auth on every scrape
    # is a 401. The metrics are sync status, nothing secret.
    metrics:
      disableAuth: true
