# On `fast`: a block device, so SQLite runs in its default WAL mode. `fast` is
# one unmirrored NVMe with no snapshot task -- losing it means every passkey
# enrolled again and every client secret rotated. Accepted until the second
# NVMe mirrors the pool.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocket-id-state
  namespace: pocket-id
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast
  resources:
    requests:
      storage: 1Gi
