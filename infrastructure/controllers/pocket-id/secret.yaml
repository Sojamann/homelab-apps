# The key that encrypts the signing keys in the database, generated in
# platform_secrets.tf. Lose it and the database is unreadable: every passkey
# and client re-registered.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pocket-id
  data:
    - secretKey: encryption-key
      remoteRef:
        key: pocket-id/app
        property: encryption-key
