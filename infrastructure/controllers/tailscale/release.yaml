# Joins the cluster to the tailnet as `tag:k8s-operator`; every proxy it spawns
# is `tag:k8s`. Egress only: an ExternalName Service annotated with a tailnet
# name gets a proxy, and in-cluster clients reach that machine through it. What
# a proxy may reach is the tailnet policy's call -- network/tailscale_policy.tf.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    operatorConfig:
      hostname: lab-k8s-operator
    # Nothing in the cluster is exposed to the tailnet through it.
    ingressClass:
      enabled: false
