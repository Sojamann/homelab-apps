# The operator's OAuth client, written in platform_secrets.tf. The chart reads
# `operator-oauth` when its own `oauth` values are empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale/operator
        property: client-id
    - secretKey: client_secret
      remoteRef:
        key: tailscale/operator
        property: client-secret
