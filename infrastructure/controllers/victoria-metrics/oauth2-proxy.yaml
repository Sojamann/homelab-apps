# Pocket ID in front of the three UIs that have no login of their own:
# VMUI, VictoriaLogs' UI and Alertmanager. Cilium's Gateway has no
# external-auth hook, so oauth2-proxy sits in the data path as a reverse proxy.
# It routes upstreams by path, not by host -- hence one container per
# hostname, all in one pod.
#
# One Pocket ID client, one cookie secret, one cookie on `.<app_domain>`: a
# login on any of the three is a login on all of them. `admins` only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: metrics
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://metrics.${app_domain}/oauth2/callback
            - --upstream=http://vmsingle-vm.monitoring.svc:8428/
          envFrom:
            - secretRef:
                name: oauth2-proxy
            - configMapRef:
                name: oauth2-proxy
          ports:
            - { name: metrics, containerPort: 4180 }
          readinessProbe: { httpGet: { path: /ready, port: metrics } }
          livenessProbe: { httpGet: { path: /ping, port: metrics } }
          resources:
            requests: { cpu: 5m, memory: 20Mi }
            limits: { memory: 128Mi }
        - name: logs
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --http-address=0.0.0.0:4181
            - --redirect-url=https://logs.${app_domain}/oauth2/callback
            - --upstream=http://victoria-logs-server.monitoring.svc:9428/
          envFrom:
            - secretRef:
                name: oauth2-proxy
            - configMapRef:
                name: oauth2-proxy
          ports:
            - { name: logs, containerPort: 4181 }
          readinessProbe: { httpGet: { path: /ready, port: logs } }
          livenessProbe: { httpGet: { path: /ping, port: logs } }
          resources:
            requests: { cpu: 5m, memory: 20Mi }
            limits: { memory: 128Mi }
        - name: alertmanager
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --http-address=0.0.0.0:4182
            - --redirect-url=https://alertmanager.${app_domain}/oauth2/callback
            - --upstream=http://vmalertmanager-vm.monitoring.svc:9093/
          envFrom:
            - secretRef:
                name: oauth2-proxy
            - configMapRef:
                name: oauth2-proxy
          ports:
            - { name: alertmanager, containerPort: 4182 }
          readinessProbe: { httpGet: { path: /ready, port: alertmanager } }
          livenessProbe: { httpGet: { path: /ping, port: alertmanager } }
          resources:
            requests: { cpu: 5m, memory: 20Mi }
            limits: { memory: 128Mi }
---
# What the three containers share. Each flag is OAUTH2_PROXY_<FLAG>.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy
  namespace: monitoring
data:
  OAUTH2_PROXY_PROVIDER: oidc
  OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Pocket ID
  OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.${app_domain}
  OAUTH2_PROXY_SCOPE: openid email profile groups
  OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
  OAUTH2_PROXY_ALLOWED_GROUPS: admins
  # The group decides; any address may belong to it.
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_COOKIE_DOMAINS: .${app_domain}
  OAUTH2_PROXY_WHITELIST_DOMAINS: .${app_domain}
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: monitoring
spec:
  selector:
    app: oauth2-proxy
  ports:
    - { name: metrics, port: 4180, targetPort: metrics }
    - { name: logs, port: 4181, targetPort: logs }
    - { name: alertmanager, port: 4182, targetPort: alertmanager }
