# VictoriaMetrics operator, VMSingle, VMAgent, VMAlert, VMAlertmanager,
# Grafana, node-exporter and kube-state-metrics.
#
# The CRDs it installs (VMServiceScrape, VMPodScrape, VMScrapeConfig, VMRule)
# are named from `infrastructure/configs` or beside the app that owns the
# target, never from this tier. Prometheus-operator kinds are not read: the
# converter is off and their CRDs are not installed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    # CRs and what the operator makes of them: vmsingle-vm, vmagent-vm,
    # vmalert-vm, vmalertmanager-vm. Subcharts keep their own names
    # (victoria-metrics-grafana, ...).
    fullnameOverride: vm

    victoria-metrics-operator:
      operator:
        disable_prometheus_converter: true
      resources:
        requests: { cpu: 50m, memory: 100Mi }
        limits: { memory: 400Mi }

    # Talos binds these to 127.0.0.1, so their targets would be permanently
    # down. Deliberately not exposed; kube-proxy is replaced by Cilium.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false

    # The apiserver's histograms were ~70% of all series. Only two feed a
    # chart rule (latency SLOs, client cert expiry); every other bucket goes.
    # The endpoint is the chart's, repeated: a list in values replaces it.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  if: '{__name__=~".+_bucket", __name__!~"apiserver_request_sli_duration_seconds_bucket|apiserver_client_certificate_expiration_seconds_bucket"}'

    # Ours are in infrastructure/configs.
    defaultDashboards:
      enabled: false

    # The sync-job fetches these at deploy time and writes them as VMRules.
    # The chart points at upstream `master`; pinned here so a values edit
    # never pulls in different rules. Renovate bumps the tags.
    defaultRules:
      sources:
        alertmanager:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/alertmanager-prometheusRule.yaml
        kubernetes-control-plane:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubernetesControlPlane-prometheusRule.yaml
        kubernetes:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubePrometheus-prometheusRule.yaml
        kube-state-metrics:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubeStateMetrics-prometheusRule.yaml
        node-exporter:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/nodeExporter-prometheusRule.yaml
        vmhealth:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.156.0/deployment/docker/rules/alerts-health.yml
        vmagent:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.156.0/deployment/docker/rules/alerts-vmagent.yml
        vmalert:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.156.0/deployment/docker/rules/alerts-vmalert.yml
        vmsingle:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.156.0/deployment/docker/rules/alerts-single-node.yml
        vmoperator:
          # renovate: datasource=github-tags depName=VictoriaMetrics/operator
          url: https://raw.githubusercontent.com/VictoriaMetrics/operator/v0.75.2/config/alerting/vmoperator-rules.yaml

    vmsingle:
      spec:
        # VM has no size cap: a full volume stops ingestion. The chart's
        # KubePersistentVolumeFillingUp warns first; grow the PVC (online,
        # never shrinks) before raising this.
        retentionPeriod: 30d
        storage:
          storageClassName: fast
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
        # No CPU limits anywhere: they cause the throttling this is here to watch.
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 2Gi }

    vmagent:
      spec:
        scrapeInterval: 30s
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 512Mi }

    vmalert:
      spec:
        evaluationInterval: 30s
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 256Mi }

    alertmanager:
      # Its own template, below; the chart's Slack one is unused.
      monzoTemplate:
        enabled: false
      spec:
        # Every link Alertmanager prints, in the UI and in a notification.
        externalURL: https://alertmanager.${app_domain}

        # Mounts the `alerting` ExternalSecret at
        # /etc/vm/secrets/alerting/<key>. Both credentials are read from those
        # files below, so neither is in this public repo.
        secrets:
          - alerting

        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: fast
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests: { cpu: 10m, memory: 50Mi }
          limits: { memory: 256Mi }

      # One Telegram group carries everything; the severity only decides
      # whether the phone makes a sound.
      config:
        route:
          group_by: [alertname, cluster, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: telegram

          # First match wins, so Watchdog is caught before the severity route.
          # It is `severity: none` and fires permanently by design: left to the
          # default it would post the same alert into the chat twice a day.
          routes:
            - receiver: heartbeat
              matchers: ['alertname = "Watchdog"']
              group_wait: 0s
              repeat_interval: 5m
            - receiver: telegram-critical
              matchers: ['severity = "critical"']
              group_wait: 10s
              repeat_interval: 4h

        # kube-prometheus' defaults, which this chart does not ship: a critical
        # mutes the warning of the same alertname and namespace, and so on down.
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: [namespace, alertname]
          - source_matchers: ['severity = "warning"']
            target_matchers: ['severity = "info"']
            equal: [namespace, alertname]
          - source_matchers: ['alertname = "InfoInhibitor"']
            target_matchers: ['severity = "info"']
            equal: [namespace]
          - target_matchers: ['alertname = "InfoInhibitor"']

        # The two Telegram receivers differ in one field. Spelled out twice
        # rather than shared by a YAML anchor: this map is parsed by kustomize,
        # by envsubst and by Helm before Alertmanager ever sees it, and an
        # alias surviving all three is not worth six saved lines.
        receivers:
          # Silent: delivered and kept in the chat, no sound. A notification
          # per warning is how you learn to swipe warnings away, which is worse
          # than not sending them.
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/vm/secrets/alerting/telegram-bot-token
                chat_id: ${telegram_chat_id}
                parse_mode: HTML
                message: '{{ template "telegram.lab.message" . }}'
                disable_notifications: true

          - name: telegram-critical
            telegram_configs:
              - bot_token_file: /etc/vm/secrets/alerting/telegram-bot-token
                chat_id: ${telegram_chat_id}
                parse_mode: HTML
                message: '{{ template "telegram.lab.message" . }}'
                disable_notifications: false

          # Watchdog turned into a heartbeat to Cronitor. When the pings stop
          # -- because VictoriaMetrics, the cluster or the WAN is what broke --
          # Cronitor notices from outside the lab and emails. Nothing inside
          # the lab can, which is the whole point.
          - name: heartbeat
            webhook_configs:
              - url_file: /etc/vm/secrets/alerting/heartbeat-url
                send_resolved: false

      # HTML, not MarkdownV2: Telegram rejects a message whose markup does not
      # parse, and the alert is then lost to a log line nobody reads.
      # MarkdownV2 needs a dozen characters escaped, several of which label
      # values carry routinely; HTML cares about three.
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.lab.message" -}}
          {{ if eq .Status "firing" }}🔴 {{ .Alerts.Firing | len }} firing{{ else }}✅ resolved{{ end }}
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
          {{ with .Annotations.summary }}{{ . }}
          {{ end }}{{ with .Annotations.description }}{{ . }}
          {{ end }}{{ with .Labels.namespace }}ns: {{ . }}
          {{ end }}{{ with .Labels.node }}node: {{ . }}
          {{ end }}{{ with .Labels.instance }}instance: {{ . }}
          {{ end }}{{ end }}
          <a href="https://alertmanager.${app_domain}">silence</a> · <a href="https://grafana.${app_domain}">grafana</a>
          {{- end }}

    # Provisioned through the sidecar's datasource ConfigMap. Each plugin type
    # is only provisioned when it is listed in `grafana.plugins`.
    defaultDatasources:
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: victoriametrics-metrics-datasource
            plugin: true
            access: proxy
            isDefault: true
            editable: false
      alertmanager:
        datasources: []
      extra:
        - name: VictoriaLogs
          uid: victoria-logs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://victoria-logs-server.monitoring.svc:9428
          isDefault: false
          editable: false

    # Stateless: no PVC, dashboards come from ConfigMaps labelled
    # `grafana_dashboard: "1"` in any namespace. UI edits are lost on restart.
    grafana:
      admin:
        existingSecret: grafana-admin
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          root_url: https://grafana.${app_domain}
        # Off since the logs datasource: in OSS every Viewer can query every
        # datasource, and logs carry emails, IPs and whatever an app prints.
        auth.anonymous:
          enabled: false
        # Pocket ID, beside the admin form rather than instead of it: the form
        # is break-glass, so no auto_login. Client id and secret arrive as
        # GF_AUTH_GENERIC_OAUTH_* from `grafana-oidc`.
        auth.generic_oauth:
          enabled: true
          name: Pocket ID
          allow_sign_up: true
          # offline_access: without it no refresh token, and the session ends
          # with the hour-long access token instead of Grafana's own 7d.
          scopes: openid email profile groups offline_access
          auth_url: https://login.${app_domain}/authorize
          token_url: https://login.${app_domain}/api/oidc/token
          api_url: https://login.${app_domain}/api/oidc/userinfo
          use_pkce: true
          use_refresh_token: true
          login_attribute_path: preferred_username
          # `admins` only: everyone else maps to no role and, strict, is refused.
          role_attribute_path: contains(groups[*], 'admins') && 'Admin' || ''
          role_attribute_strict: true
        # Grafana's sqlite is on an emptyDir. WAL lets the readers and the
        # dashboard sidecar's writes overlap instead of returning SQLITE_BUSY.
        database:
          wal: true
        dashboards:
          default_home_dashboard_path: /tmp/dashboards/lab.json
      # Not core Grafana: downloaded from grafana.com on every start (the pod is
      # stateless). Unreachable grafana.com -> no datasources at all.
      plugins:
        # renovate: datasource=custom.grafana-plugins depName=victoriametrics-metrics-datasource
        - victoriametrics-metrics-datasource@1.0.1
        # renovate: datasource=custom.grafana-plugins depName=victoriametrics-logs-datasource
        - victoriametrics-logs-datasource@0.34.0
      # 400Mi was ~200KiB under the peak: constant GC, health checks timing
      # out, and the kubelet killing it on liveness. Limits here are ceilings
      # against a leak, not reservations -- only requests take node capacity.
      resources:
        requests: { cpu: 50m, memory: 300Mi }
        limits: { memory: 1Gi }
      sidecar:
        # Flat: no `default` folder in the UI, and the home path above holds.
        dashboards:
          folder: /tmp/dashboards
          defaultFolderName: null
          searchNamespace: ALL
        resources:
          requests: { cpu: 10m, memory: 50Mi }
          limits: { memory: 256Mi }

    kube-state-metrics:
      resources:
        requests: { cpu: 20m, memory: 100Mi }
        limits: { memory: 400Mi }

    prometheus-node-exporter:
      # Its series only carry `instance` (an IP:port); dashboards group by node.
      vmScrape:
        spec:
          endpoints:
            - port: metrics
              metricRelabelConfigs:
                - action: drop
                  source_labels: [mountpoint]
                  regex: "/var/lib/kubelet/pods.+"
              relabelConfigs:
                - sourceLabels: [__meta_kubernetes_pod_node_name]
                  targetLabel: node
                  action: replace
      resources:
        requests: { cpu: 20m, memory: 30Mi }
        limits: { memory: 128Mi }
