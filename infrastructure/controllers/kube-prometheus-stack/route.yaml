apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - grafana.${app_domain}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
