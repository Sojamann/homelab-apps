apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - grafana.${app_domain}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
# Alertmanager has no authentication of its own, so this is every LAN and
# NetBird peer being able to silence alerts. Taken on purpose: silencing a
# known issue from a phone is the operation you want at 3am, and a port-forward
# from a laptop is not available then.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - alertmanager.${app_domain}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
