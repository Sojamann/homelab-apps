# Grafana's admin, generated in platform_secrets.tf. Anonymous visitors get
# Viewer; this is for editing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password
