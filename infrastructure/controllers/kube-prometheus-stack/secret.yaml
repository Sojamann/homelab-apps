# Grafana's admin, generated in platform_secrets.tf. Anonymous visitors get
# Viewer; this is for editing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password
---
# Grafana's Pocket ID client, registered by hand in Pocket ID and written in
# platform_secrets.tf. Keys are Grafana's env names, so the chart's
# `envFromSecret` loads them as they are.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-oidc
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef:
        key: monitoring/grafana-oidc
        property: client-id
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: monitoring/grafana-oidc
        property: client-secret
---
# Alertmanager's two receivers, written in platform_secrets.tf. Mounted rather
# than read as environment: `alertmanagerSpec.secrets` puts both keys under
# /etc/alertmanager/secrets/alerting/, which is what `bot_token_file` and
# `url_file` want -- so neither credential has to appear in this public repo.
#
# The Telegram chat id is not here. It is no credential, and arrives through
# `cluster-vars` as `${telegram_chat_id}` instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerting
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alerting
  data:
    - secretKey: telegram-bot-token
      remoteRef:
        key: monitoring/alerting
        property: telegram-bot-token
    - secretKey: heartbeat-url
      remoteRef:
        key: monitoring/alerting
        property: heartbeat-url
