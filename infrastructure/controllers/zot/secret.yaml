# The `push` user's htpasswd line, generated in platform_secrets.tf. The
# plaintext sits beside it in OpenBao for `docker login`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: zot
  data:
    - secretKey: htpasswd
      remoteRef:
        key: zot/registry
        property: htpasswd
