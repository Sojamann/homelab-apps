apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: zot
spec:
  replicas: 1
  # Two instances on one rootDirectory would race GC against each other.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:v2.1.22
          args: [serve, /etc/zot/config.json]
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet: { path: /startupz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 30
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
            - name: auth
              mountPath: /etc/zot/auth
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: config
          configMap:
            name: zot
        - name: auth
          secret:
            secretName: zot
        - name: data
          persistentVolumeClaim:
            claimName: zot-data
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: zot
spec:
  selector:
    app: zot
  ports:
    - name: http
      port: 5000
      targetPort: http
