apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
  namespace: zot
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - registry.${app_domain}
  rules:
    # Envoy's 15s default would cut off large layer uploads.
    - timeouts:
        request: 0s
      backendRefs:
        - name: zot
          port: 5000
