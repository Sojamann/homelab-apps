# Garage on the NAS -- see machines/truenas.md. Caddy exposes only `/metrics`
# of the admin API on the k8s address.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: garage
  namespace: monitoring
spec:
  scheme: https
  # No jobName on a VMScrapeConfig, see ../nas/scrape.yaml.
  relabelConfigs:
    - targetLabel: job
      replacement: garage
  authorization:
    type: Bearer
    credentials:
      name: garage-metrics
      key: token
  staticConfigs:
    - targets:
        - s3-k8s.${lab_domain}:3903
      labels:
        node: nas
