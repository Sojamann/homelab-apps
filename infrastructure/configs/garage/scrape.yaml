# Garage on the NAS -- see machines/truenas.md. Caddy exposes only `/metrics`
# of the admin API on the k8s address.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: garage
  namespace: monitoring
spec:
  jobName: garage
  scheme: HTTPS
  authorization:
    type: Bearer
    credentials:
      name: garage-metrics
      key: token
  staticConfigs:
    - targets:
        - s3-k8s.${lab_domain}:3903
      labels:
        node: nas
