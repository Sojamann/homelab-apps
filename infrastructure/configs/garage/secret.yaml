# Garage's `metrics_token`, written in platform_secrets.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-metrics
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garage-metrics
  data:
    - secretKey: token
      remoteRef:
        key: monitoring/garage
        property: metrics-token
