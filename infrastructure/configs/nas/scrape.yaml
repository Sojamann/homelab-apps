# node-exporter as a TrueNAS custom app -- see machines/truenas.md.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: nas
  namespace: monitoring
spec:
  # VMScrapeConfig has no jobName; the operator's would be
  # `scrapeConfig/monitoring/<name>`, and rules and dashboards match on this.
  relabelConfigs:
    - targetLabel: job
      replacement: nas
  staticConfigs:
    - targets:
        - nas-k8s.${lab_domain}:9100
      labels:
        node: nas
