# `origin: lab` on every rule here: it is what separates these from the ~134 the
# chart ships. Grafana filters on `label:origin=lab`, Alertmanager matches on it,
# and it is a matcher away from routing this lab's own alerts differently.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nas
  namespace: monitoring
spec:
  groups:
    - name: nas
      rules:
        - alert: NasDown
          expr: up{job="nas"} == 0
          for: 5m
          labels:
            severity: critical
            origin: lab
          annotations:
            summary: NAS node-exporter unreachable
        - alert: NasPoolNotOnline
          expr: node_zfs_zpool_state{job="nas", state="online"} == 0
          for: 5m
          labels:
            severity: critical
            origin: lab
          annotations:
            summary: "Pool {{ $labels.zpool }} is not ONLINE"
        # Fed by the TrueNAS cron job; 80% is where ZFS starts to slow down.
        - alert: NasPoolFull
          expr: nas_zpool_allocated_bytes{job="nas"} / nas_zpool_size_bytes{job="nas"} > 0.8
          for: 15m
          labels:
            severity: warning
            origin: lab
          annotations:
            summary: "Pool {{ $labels.pool }} is {{ $value | humanizePercentage }} full"
        # Fed by the snapshot textfile cron. Hourly snapshots and replication:
        # 2h means one run was missed. A dead cron ages out the same way.
        - alert: NasSnapshotStale
          expr: time() - nas_snapshot_newest_timestamp_seconds{job="nas"} > 7200
          for: 15m
          labels:
            severity: warning
            origin: lab
          annotations:
            summary: "No snapshot of {{ $labels.dataset }} for {{ $value | humanizeDuration }}"
        - alert: NasSnapshotMetricsAbsent
          expr: absent(nas_snapshot_newest_timestamp_seconds{job="nas"})
          for: 1h
          labels:
            severity: warning
            origin: lab
          annotations:
            summary: NAS snapshot metrics missing (textfile cron not writing)
        # The driver refuses to delete a zvol whose snapshots still inherit
        # democratic-csi:managed_resource=true; the NAS cron flips it hourly.
        - alert: PersistentVolumeStuckReleased
          expr: |
            kube_persistentvolume_status_phase{phase="Released"} == 1
              and on (persistentvolume) kube_persistentvolume_info{storageclass="fast"}
          for: 1h
          labels:
            severity: warning
            origin: lab
          annotations:
            summary: "PV {{ $labels.persistentvolume }} stuck Released (NAS snapshot fixup?)"
