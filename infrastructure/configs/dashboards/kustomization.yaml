# Grafana dashboards, one directory per Grafana folder, one ConfigMap per JSON
# file, picked up by the sidecar.
#
# Edit in the UI, then Share -> Export -> paste over the file here: Grafana is
# stateless, so the export is the save.
#
# Substitution is off for these: Flux would otherwise read Grafana's
# `${namespace}` variables as its own and blank them. generatorOptions do not
# inherit, so each directory repeats them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s
  - nas
  - proxmox
