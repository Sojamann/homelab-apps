# Shared services, the CRs half. Applied once `infrastructure` is healthy, so
# every kind a chart there installs exists by the time this names it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/configs
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
