# Shared services, the charts half. `infrastructure-configs` depends on this
# tier being healthy, which is what lets a CRD installed here be named there.
#
# The name predates the split and stays: renaming it prunes its inventory, and
# pruning the CNPG release takes its CRDs and every database with them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/controllers
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
